  from: kition-one e2e/collab-managed.mjs (MC-02, MC-05, MC-16, MC-17, MC-18, MC-24)
  license: Apache-2.0
input: []
steps:
  - cargo-test:
      package: kition-layout-kit
      test: coediting
expected:
