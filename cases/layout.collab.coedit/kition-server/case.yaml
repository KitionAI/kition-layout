format: 1
id: layout.collab.coedit/kition-server
feature: layout.collab.coedit
intent: >-
  Three people on a real Kition Server (kition-server in memory), each with the Layout engine's
  replica relayed by @kition/sync as the editor's runtime relays it: two editors converge, the
  room refuses a viewer's push and the viewer's edit never reaches an editor, and a page offline
  for 31 s and edited on both sides converges when it reconnects.
layer: gate
source:
  kind: synthetic
  from: kition-one e2e/collab-managed.mjs (MC-02, MC-16, MC-17, MC-18)
  license: Apache-2.0
input: []
steps:
  - exec:
      cmd: [node, web/tests/collab.mjs]
expected:
  - actual: out:exec
    compare: exit
    value: 0
# kition-server is a private tool (docs/quality.md, Private tools): without it the runner prints
# `SKIP: <reason>` and counts this case as skipped, neither passed nor failed, without running its
# steps. Run by hand, web/tests/collab.mjs prints the same line and exits 77.
requires: [kition-server]
# Starting the server, three cases and a 31 s offline spell: the gate cap, not the 20 s default.
timeout_s: 60
since: "2026-11-17"
