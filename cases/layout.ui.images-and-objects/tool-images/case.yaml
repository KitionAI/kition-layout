  the image's own handles size it, Shift keeping its proportions; Escape goes back to the frame and
  the arrows move the image; a double click on a handle fits the frame along that side; a click on
  one of several selected objects makes it the key object; the Eyedropper samples an image (Shift
  the stroke) and picks up text.
