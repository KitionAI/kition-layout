feature: layout.ui.panels-and-styles
intent: >-
  In the engine: swatch.set changes a swatch's colour, process or spot and a tint swatch's tint in
  one undo step, a new name (or a value-named swatch's new colour) follows every use (objects,
  text, styles, tints), special swatches keep theirs; swatch.delete with replaceWith hands every
  use to another swatch; Redefine Style (fromSelection) takes the selected text's look into a
  paragraph or character style and drops the overrides that now say the same; a dialog previews
  several commands as one step (Cancel leaves nothing, OK one step, a failing step nothing).
