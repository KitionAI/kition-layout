id: layout.ui.properties/panel-rules
feature: layout.ui.properties
intent: >-
  The panel's rules without a browser: colours go between hex, RGB and CMYK and a CMYK colour
  reaches the engine as CMYK; X and Y read at the reference point and linked sizes keep the
  proportions; every fixed-value button (align, distribute, wrap, pathfinder, fitting) is a menu
  row with its Chinese label; X swaps each object's fill and stroke and D gives none and a black
  1 pt stroke; new objects go on the selection's layer and a document opened on an empty layer
  moves to the topmost layer with objects; a font file names its family; the panel's words are in
  English and Chinese; and the built engine takes every stroke type, arrowhead, corner shape, text
  frame option, wrap offset, character and paragraph value the panel sends and reads each back.
