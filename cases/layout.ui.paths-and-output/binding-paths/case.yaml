feature: layout.ui.paths-and-output
intent: >-
  In the binding: the Pen's cursor over a selected path is a CSS name for each thing a click does
  (copy add, no-drop delete, cell continue, alias close, crosshair place); clicks continue and close
  the path, and inspect reads its points back on the spread; Direct Selection's marquee selects
  the points of two paths, a drag moves both as one undo step and an arrow moves both.
