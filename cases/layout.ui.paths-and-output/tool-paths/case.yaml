intent: >-
  In the tools: the Pen on a selected path sends path.addAnchor on the outline and
  path.deleteAnchor on an anchor, continues an open path from either end (path.appendAnchor with
  subpath, and at start from the first anchor; a drag on the end point turns its direction lines),
  closes on the first anchor, and its cursor says which; Direct Selection's marquee selects anchor
  points across paths, Shift+click adds a point and takes it away, a drag previews every selected
  point's path together and commits once, and the arrows and Delete send one step for all paths.
