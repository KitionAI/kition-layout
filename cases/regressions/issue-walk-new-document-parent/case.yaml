format: 1
id: regressions/issue-walk-new-document-parent
feature: layout.file.new-document
intent: >-
  New Document's margins and columns did not reach A-Parent (it kept half an inch and one column):
  Margins and Columns set the document's pages even while the parents were edited. Editing parents,
  it sets the parents' pages, and New Document uses that for A-Parent.
