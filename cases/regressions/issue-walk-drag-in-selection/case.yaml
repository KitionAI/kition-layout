format: 1
id: regressions/issue-walk-drag-in-selection
feature: layout.ui.text-and-tables
intent: >-
  After five clicks selected the story, a new drag in it still left the whole story selected: the
  press in the selected text began a drag-and-drop move that dropped back in itself and changed
  nothing. A drag that starts and ends in the selected text selects from its press to its release.
