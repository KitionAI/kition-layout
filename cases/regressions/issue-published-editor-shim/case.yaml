format: 1
id: regressions/issue-published-editor-shim
feature: layout.editor.display-modes
intent: >-
  The development page opens the editor on the published @kition/kit-editor installed from the
  lockfile, as GitHub CI does: Vite converts the CommonJS use-sync-external-store shim the editor's
  UI library reaches, which it does not scan while @kition/kit-editor is excluded from
  pre-bundling, so the page loads and every display mode shows. Before, the browser refused the shim
  ("does not provide an export named 'useSyncExternalStore'"), the page never opened, and
  test:flow, test:export, test:modes and test:focus timed out on CI (run 44864089864). A linked
  kit-editor checkout hid it locally.
layer: gate
source:
  kind: issue
  from: Kition kit CI, run 44864089864 (test:flow, test:export, test:modes, test:focus)
  license: owned
input: []
steps:
  - exec:
      cmd: [pnpm, --dir, web, exec, node, tests/modes.mjs, chromium]
expected:
  - actual: out:exec
    compare: exit
    value: 0
tags: [browser]
requires: [chromium]
timeout_s: 60
since: "2026-11-21"
