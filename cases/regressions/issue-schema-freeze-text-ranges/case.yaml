format: 1
id: regressions/issue-schema-freeze-text-ranges
feature: layout.reference.navigation
intent: >-
  The document keeps the text a hyperlink starts from and the text a data merge placeholder covers
  as a mark on that text, so the range moves with the text when someone types before it. A
  character carries one hyperlink and one placeholder at most, and a mark needs a character:
  hyperlink.create refuses text another hyperlink already starts from, and data.placeholder.add
  refuses an empty range and text another placeholder covers. Before, such hyperlinks and
  placeholders were made and lost one of their sources when the document was read again.
layer: gate
source:
  kind: issue
  from: schema-freeze (kition-plan plans/2026-11-22-schema-freeze.md, layout item 1)
  license: owned
input: []
steps:
  - cargo-test: { package: kition-layout-engine, test: text_ranges }
expected:
  - actual: out:cargo-test
    compare: exit
    value: 0
