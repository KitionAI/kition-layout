feature: layout.type.format
intent: >-
  A paragraph's rules (and shading) move with its text when the frame justifies its text
  vertically: in a frame centred vertically the rule below a heading sits just under it. Before,
  rules stayed where the text would have been at the top and struck through other text. Drop caps
  and balanced columns are still not drawn.
