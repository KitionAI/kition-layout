format: 1
id: regressions/issue-hidden-baseline-snap
feature: layout.ui.view-options
intent: >-
  A shape drawn with the Rectangle tool snapped to an invisible 12 pt grid (dragged to 160, it ended
  at 156; the readout, the panel and the result said three sizes): the baseline grid, hidden, still
  caught every drag with Snap to Guides on, before a ruler guide could. The editor keeps the
  baseline grid out of snapping while it is hidden, and the readout shows the shape as drawn.
