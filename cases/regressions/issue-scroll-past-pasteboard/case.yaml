format: 1
id: regressions/issue-scroll-past-pasteboard
feature: layout.editor.canvas-scroll
intent: >-
  The wheel scrolls the canvas only as far as the pasteboard the engine draws around the spreads: on every side
  the view stops at the canvas's edge, at the opening zoom and zoomed in, and a view larger than the canvas keeps
  it centred. A scrollbar is over the canvas's right or bottom edge only while the canvas is longer than the view
  there, at the view's position, and moves the view (Home, End). Before, the editor gave the canvas no scroll limits, so the view moved any distance past the
  spreads and showed hundreds of points of empty canvas above, below and beside the page (owner report,
  2026-11-22).
layer: gate
