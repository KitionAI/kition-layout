format: 1
id: regressions/issue-focus-rulers-escape
feature: layout.editor.display-modes
intent: >-
  Focus shows the canvas alone: the rulers and their tracks are left out, and come back on leaving. Escape in Focus
  cancels first (it ends a pen path, or clears the selection) and stays in Focus; only an Escape with nothing to
  cancel leaves it. Before, the rulers were still drawn in Focus, and an Escape with a
  selection left Focus instead of clearing it.
