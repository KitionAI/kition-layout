format: 1
id: regressions/issue-press-count-order
feature: layout.ui.images-and-objects
intent: >-
  A fast double click gave both of its presses the count two: the editor counts presses as they
  come but sends each on when its queue reaches it, and read the latest count then, so a double
  click toggled a frame to its image and straight back. Each counted press now waits in order for
  its own press.
layer: gate
