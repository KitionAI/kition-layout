format: 1
id: layout.file.content-only/reopen-and-converge
feature: layout.file.content-only
intent: >-
  A .klayout opened without a store is the same document (docId, item ids, version) and takes
  edits that save and reopen; a replica opened from the file and the session with the whole
  history converge after both edit; undo after a save takes back the last edit, then the one
  before; a file opens on the host's stored replica that holds its version as that replica, history
  kept, and a file saved elsewhere opens on the stored replica by its state, keyed by object id.
layer: gate
source:
  kind: synthetic
  from: bindings/wasm/tests/content_file.rs
  license: Apache-2.0
input: []
steps:
  - cargo-test: { package: kition-layout-kit, test: content_file, filter: a_file_opened_without_a_store_is_the_same_document_and_edits }
  - cargo-test: { package: kition-layout-kit, test: content_file, filter: a_replica_from_the_file_and_one_with_the_whole_history_converge }
  - cargo-test: { package: kition-layout-kit, test: content_file, filter: undo_after_a_save_takes_back_the_last_edit }
  - cargo-test: { package: kition-layout-kit, test: content_file, filter: a_file_opens_on_the_stored_replica }
  - cargo-test: { package: kition-layout-kit, test: content_file, filter: a_file_saved_elsewhere_opens_on_the_stored_replica_by_its_state }
expected:
  - actual: out:cargo-test
    compare: exit
    value: 0
since: "2026-11-23"
