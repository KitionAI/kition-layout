format: 1
id: layout.file.content-only/no-history
feature: layout.file.content-only
intent: >-
  A layout whose change log holds typed-then-deleted text, a deleted frame and an overwritten
  title saves to a .klayout whose content entry (content.json) holds the state, no version,
  lineage, actor or origin, and none of those strings, each found in the session's change log
  first; an unchanged layout saves to the same bytes, twice, after markSaved and from the file
  opened again, which holds the same objects under the same ids; through the headless kit, an
  agent's batches save files holding no history.
layer: gate
source:
  kind: synthetic
  from: bindings/wasm/tests/content_file.rs (an_unchanged_layout_saves_to_the_same_bytes_and_its_content_holds_no_history), bindings/headless/tests/content_file.rs
  license: Apache-2.0
input: []
steps:
  - cargo-test: { package: kition-layout-kit, test: content_file, filter: an_unchanged_layout_saves_to_the_same_bytes }
  - cargo-test: { package: kition-layout, test: content_file }
expected:
  - actual: out:cargo-test
    compare: exit
    value: 0
