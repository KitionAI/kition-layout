feature: layout.ui.named-things
intent: >-
  In the engine: swatch.add with gradient makes a named gradient swatch (linear or radial, stops
  from colour values or colour swatches, midpoints) in one undo step; on a fill and on a stroke the
  screen shows the gradient; swatch.set changes its kind and stops and renames it with every use
  following; swatch.delete hands its uses to a replacement; the swatch, its stops and midpoints
  survive saving and reopening the .klayout file and IDML export and import.
