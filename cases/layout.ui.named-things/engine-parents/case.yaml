format: 1
id: layout.ui.named-things/engine-parents
feature: layout.ui.named-things
intent: >-
  In the engine: layout.parents.set renames a parent, bases it on another (its objects then show on
  the pages under the parent's own) and sets its page count (objects on pages taken away go), one
  undo step each, refusing a loop, a taken prefix or a bad count; layout.parents.duplicate copies a
  parent and its objects (new ids, a story of its own) under the next prefix; layout.parents.delete
  hands the pages and the parents based on it to the replacement (or none) and undo brings it back.
layer: gate
