format: 1
id: layout.agent.act/retitle
feature: layout.agent.act
intent: >-
  The agent changes the headline's words in place (the story of the existing frame), not by deleting the frame and drawing a new one: the frame keeps its position and size.
layer: eval
source:
  kind: synthetic
  from: repo:conformance/basic.klayout
  license: Apache-2.0
  note: "A copy of the conformance fixture the layout engine writes: a text frame \"Spring concert\" (story 8) above a rectangle, on one letter page."
input: [input/poster.klayout]
steps:
  - task:
      prompt: >-
        In poster.klayout, change the headline to "Spring concert 2026". Keep the headline's frame
        where it is and change nothing else.
      max_turns: 20
  - inspect: { path: poster.klayout, as: after }
expected:
  - actual: out:after
    compare: values
    value:
      details.stories: { count: 1 }
      details.stories.0.preview: Spring concert 2026
  - actual: out:after
    compare: values
    collateral: true
    value:
      details.spreads.0.items: { count: 2 }
      details.spreads.0.items.0.bounds: [72, 72, 540, 160]
  - actual: out:after
    compare: values
    collateral: true
    value:
      details.spreads.0.items: { any: { kind: "<rectangle>", bounds: [72, 200, 540, 260] } }
solution:
  - tool: layout_run
    args: { path: poster.klayout, steps: [{ command: story.setText, params: { story: 8, text: Spring concert 2026 } }] }
since: "2026-11-17"
timeout_s: 600
