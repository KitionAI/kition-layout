[package]
name = "kition-layout"
description = "The Layout kit for Kition's agent: the Kition SDK document served headless over the Kit Protocol."
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
kition-layout-kit = { path = "../wasm" }
kition-headless = { workspace = true }

[dev-dependencies]
# workspace_only.rs: the pictures it plants and reads back, and the IDML packages it writes.
image = { workspace = true }
zip = { workspace = true }
# workspace_only.rs: a font planted in the home folder's font folders.
kition-layout-fonts = { workspace = true, features = ["testing"] }
kition-kit-server = { workspace = true }
kition-kit = { workspace = true }
kition-kits = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }
