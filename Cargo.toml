[workspace]
resolver = "3"
members = ["crates/*/*", "bindings/*", "tools/xtask"]
default-members = ["crates/*/*", "bindings/headless", "tools/xtask"]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/KitionAI/kition-layout"

[workspace.dependencies]
# kition-sdk, pinned by commit (one revision for every crate of it)
kition-headless = { git = "https://github.com/KitionAI/kition-sdk", rev = "c7db9495b565de75158da59ee9e36700b0595944" }
kition-kit-server = { git = "https://github.com/KitionAI/kition-sdk", rev = "c7db9495b565de75158da59ee9e36700b0595944" }
kition-kit = { git = "https://github.com/KitionAI/kition-sdk", rev = "c7db9495b565de75158da59ee9e36700b0595944" }
# A host of kit processes (`HeadlessKit`), for the `file.identity` tests.
kition-kit-host = { git = "https://github.com/KitionAI/kition-sdk", rev = "c7db9495b565de75158da59ee9e36700b0595944" }
kition-kits = { git = "https://github.com/KitionAI/kition-sdk", rev = "c7db9495b565de75158da59ee9e36700b0595944" }
# The Kition platform convergence suite (L6), a test dependency at the same revision.
kition-convergence = { git = "https://github.com/KitionAI/kition-sdk", rev = "c7db9495b565de75158da59ee9e36700b0595944" }

# internal
kition-layout-geom = { path = "crates/support/geom" }
kition-layout-color = { path = "crates/support/color" }
kition-layout-doc = { path = "crates/engine/doc" }
kition-layout-fonts = { path = "crates/support/fonts" }
kition-layout-compose = { path = "crates/engine/compose" }
kition-layout-images = { path = "crates/formats/images" }
kition-layout-render = { path = "crates/render/render" }
kition-layout-pdf = { path = "crates/formats/pdf" }
kition-layout-idml = { path = "crates/formats/idml" }
kition-layout-epub = { path = "crates/formats/epub" }
kition-layout-textimport = { path = "crates/formats/textimport" }
kition-layout-format = { path = "crates/formats/format" }
kition-layout-tools = { path = "crates/engine/tools" }
kition-layout-engine = { path = "crates/engine/engine" }
kition-layout-kdm = { path = "crates/kdm/kdm-model" }
kition-layout-testkit = { path = "crates/testkit" }

# foundation
kurbo = { version = "0.13", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
proptest = "1"
rayon = "1"
unicode-bidi = "0.3"
unicode-script = "0.5"
unicode-bidi-mirroring = "0.4"
unicode-segmentation = "1"
caseless = "0.2"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
tempfile = "3"
sha2 = "0.10"

# text / rendering / formats
skrifa = "0.47"
harfrust = "0.13"
vello_cpu = "0.2"
vello_common = { version = "0.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
# CMYK TIFF samples for PDF export (`image` decodes them to RGB); the version `image` uses.
tiff = "0.11"
# SVG (same usvg as krilla-svg).
resvg = { version = "0.47", default-features = false, features = ["text"] }
krilla-svg = "0.8"
# Boolean operations on Bézier paths (Pathfinder).
flo_curves = "0.8"
# QR codes (Object › Generate QR Code); MIT.
qrcodegen = "1.8"
krilla = { version = "0.8", features = ["pdf"] }
hayro = "0.7"
quick-xml = "0.38"
zip = { version = "3", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
