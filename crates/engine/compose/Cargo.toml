[package]
name = "kition-layout-compose"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kition Layout text composition: paragraph composer (Knuth–Plass), hyphenation, justification, columns, threading, wrap"

[lints]
workspace = true

[dependencies]
unicode-bidi = { workspace = true }
unicode-bidi-mirroring = { workspace = true }
kition-layout-geom = { workspace = true }
kition-layout-color = { workspace = true }
kition-layout-doc = { workspace = true }
kition-layout-fonts = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
miniz_oxide = "0.8"
hypher = { version = "0.1.8", default-features = false, features = ["alloc", "spanish"] }

[dev-dependencies]
kition-layout-fonts = { workspace = true, features = ["testing"] }
proptest = { workspace = true }
