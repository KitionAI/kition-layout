[package]
name = "kition-layout-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kition Layout renderer: spreads, pages, frames, composed text and images to pixels (vello_cpu)"

[lints]
workspace = true

[dependencies]
kition-layout-geom = { workspace = true }
kition-layout-color = { workspace = true }
kition-layout-doc = { workspace = true }
kition-layout-fonts = { workspace = true }
kition-layout-compose = { workspace = true }
vello_cpu = { workspace = true }
vello_common = { workspace = true }
image = { workspace = true }
hayro = { workspace = true }
kition-layout-images = { workspace = true }
log = { workspace = true }
serde = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
