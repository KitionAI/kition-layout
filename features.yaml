    gap: "Engine tests merge a draft, compare it first, restore a version, name reply ids, answer receipts and the object model; test:contract checks the built engine exports every member; no case drives a draft or a restore in the editor yet."
    cases: [layout.collab.drafts/engine-members]
    since: "2026-11-25"
  - id: layout.collab.coedit
    title: "Real-time co-editing: editors converge, viewers cannot write, an offline page catches up"
    dimension: [collab]
    priority: P1
    status: partial
    paths: [web/src/main.tsx, web/src/panels, bindings/wasm/src/collab.rs, crates/engine/doc/src/build.rs, bindings/wasm/tests/coediting.rs]
    gap: >-
      Kition Desktop is for one person since the plain document model (kition-sdk 91cf510, plan
      2026-11-24): the KDM no longer merges concurrent edits, so the convergence suite, the
      kition-server co-editing script and the layout's merge tests are gone; co-editing comes back
      with Kition One's server-ordered changes. What stays: every edit is a KDM change with stable
      ids, a viewer's editor writes nothing to the replica, and a page on the editor's line of
      changes follows its edits in order. Not yet: a server-ordered change stream, presence.
    cases: [layout.collab.coedit/engine-replicas, regressions/issue-frame-create-text, regressions/issue-concurrent-ids]
    since: "2026-11-17"
